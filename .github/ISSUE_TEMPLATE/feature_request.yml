name: "Suggestion"
description: Suggest a new idea for Shaderite
title: "[Suggestion]: "
labels: [enhancement]

body:
  - type: dropdown
    id: suggestion-type
    attributes:
      label: "Type of suggestion"
      description: "Select what category your suggestion fits into"
      options:
        - New loaders
        - New utilities
        - Class improvement
        - Else
    validations:
      required: true

  - type: input
    id: short-description
    attributes:
      label: "Short description"
      description: "Summarize your idea in one sentence"

  - type: textarea
    id: detailed-description
    attributes:
      label: "How do you see this idea fitting into the library?"
      description: "Explain how this suggestion improves or expands the library"