name: "🐛 Bug Report"
description: Report a bug with Shaderite
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!  
        Please fill out the sections below.

  - type: input
    id: mc_version
    attributes:
      label: "Minecraft Version"
      placeholder: "e.g. 1.21"
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: "Shaderite Version"
      placeholder: "e.g. 0.0.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "What happened? What did you expect instead?"
      placeholder: "When I use the ShaderLoader.class on a dedicated server..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions"
      placeholder: |
        1. Start NeoForge server  
        2. Join world  
        3. Crash happens

  - type: textarea
    id: logs
    attributes:
      label: "Logs/Crash Report"
      description: "Paste the relevant part of the log or link a gist/pastebin"
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Anything else we should know?"